#{include file="../Common/Header.html"}
<div class="layui-container fly-marginTop fly-user-main">
    #{include file="../Common/Nav.html"}
    <div class="fly-panel fly-panel-user" pad20>
        <div class="layui-tab layui-tab-brief">
            <div class="content-header">
                <i class="layui-icon">&#xe638;</i> 我的用户
            </div>

            <div class="content-body">
                <table id="member-table"></table>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        layui.use(['hex', 'form'], function () {
            let table = $("#member");
            let cao = layui.hex;
            let queryParams = null;
            table.bootstrapTable({
                url: '/user/api/agentMember/data',
                method: "post",
                pageSize: 8,
                showRefresh: false,
                cache: false,
                showToggle: false,
                cardView: false,
                pagination: true,
                pageNumber: 1,
                singleSelect: false,
                sidePagination: 'server',
                contentType: "application/x-www-form-urlencoded",
                dataType: "json",
                queryParamsType: 'limit',
                queryParams: function (params) {
                    params.page = (params.offset / params.limit) + 1;
                    if (queryParams) {
                        for (const key in params) {
                            queryParams[key] = params[key];
                        }
                    } else {
                        queryParams = params;
                    }
                    return queryParams;
                },
                
                responseHandler: function (res) {
                    return {
                        "total": res.count,
                        "rows": res.data
                    }
                },
                columns: [
                    {field: 'id', title: 'ID', width: 80}
                    , {
                        field: 'avatar', title: '用户', formatter: function (val, item) {
                            if (!item.avatar) {
                                item.avatar = "/favicon.ico";
                            }
                            return '<span><img src="' + item.avatar + '" alt="' + item.username + ' 头像" width="18" height="18" loading="lazy" decoding="async" style="width: 18px;border-radius: 100%;"/> ' + item.username + '</span> '
                        }
                    }
                    , {
                        field: 'group', title: '会员等级', formatter: function (val, item) {
                            return '<img style="height: 32px;" src="' + item.group.icon + '" alt="' + item.group.name + ' 等级图标" width="32" height="32" loading="lazy" decoding="async" title="' + item.group.name + ' (减免:' + (item.group.discount * 100) + '%)">'
                        }
                    }
                    , {
                        field: 'email', title: '邮箱', formatter: function (val, item) {
                            if (!item.email) {
                                return "-";
                            }
                            return item.email;
                        }
                    }
                    , {
                        field: 'phone', title: '手机号', formatter: function (val, item) {
                            if (!item.phone) {
                                return "-";
                            }
                            return item.phone;
                        }
                    }
                    , {
                        field: 'qq', title: 'QQ', formatter: function (val, item) {
                            if (!item.qq) {
                                return "-";
                            }
                            return item.qq;
                        }
                    }
                    , {
                        field: 'balance', title: '余额', formatter: function (val, item) {
                            return '<span class="acg-badge acg-badge-light-success">￥' + item.balance + '</span>'
                        }
                    }
                    , {
                        field: 'recharge', title: '总充值', formatter: function (val, item) {
                            return '<span class="acg-badge acg-badge-light-primary">' + item.recharge + '</span>'
                        }
                    }
                    , {
                        field: 'create_time', title: '注册时间'
                    }
                ]
            });

            cao.query('.search-query', table, [
                {
                    title: "查询会员ID", name: "equal-id", type: "input"
                }
            ], true, false);
        });
    });
</script>

#{ready("/assets/user/controller/user/child.js")}
#{include file="../Common/Footer.html"}
