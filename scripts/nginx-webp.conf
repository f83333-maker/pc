# ============================================================
# Nginx WebP 自适应交付配置
# 把这段配置添加到宝塔站点设置 -> 配置文件 的 server { } 块内
# 必须放在 "静态资源长缓存" 那段 location ~* \.(css|js|...) 之前
# ============================================================
#
# 工作原理:
#   1. 浏览器请求 xxx.png 时, Nginx 检测它的 Accept 头是否包含 image/webp
#   2. 如果支持 WebP 且服务器上存在 xxx.webp, 则直接吐 xxx.webp (体积小)
#   3. 如果不支持 (老浏览器/爬虫) 或 .webp 不存在, 吐原始 xxx.png
#   4. URL 不变, 数据库不变, PHP 不变, 模板不变
# ============================================================

# --- 1. 在 server {} 顶部 (或 http {} 顶部) 添加 map 指令 ---
# 这个 map 必须在 location 之外
# 如果你的配置里其它 server 块也要复用, 建议放到 nginx.conf 的 http {} 内
map $http_accept $webp_suffix {
    default   "";
    "~*image/webp" ".webp";
}

# --- 2. 替换或新增图片 location 块 ---
# 仅对 /assets/cache 路径下的图片做 WebP 自适应 (因为我们只转换了这个目录)
# 其他静态图 (/assets/admin/images/, /assets/static/images/ 等) 保持原状
location ~* ^/assets/cache/.+\.(png|jpe?g)$ {
    add_header Vary "Accept";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header CDN-Cache-Control "public, max-age=31536000, must-revalidate";
    expires 1y;
    access_log off;
    try_files $uri$webp_suffix $uri =404;
}

# --- 3. 提示 ---
# - 如果你之前已经加了 `location ~* \.(css|js|woff|...)$` 的长缓存配置, 
#   保留即可, 上面这段 location 优先级更高 (更具体的路径) 不会冲突
# - 如果浏览器 DevTools 看到的还是原 .png 而不是 .webp:
#     a) 检查 .webp 文件是否真的生成了
#     b) 检查是否设置了 Cloudflare 的 "缓存级别 Cache Everything", 
#        如果是, 必须在 Cloudflare 那边把 Cache Key 加上 Accept 头, 
#        否则 Cloudflare 会把 .png 缓存给所有人 (不区分浏览器是否支持 webp)
#     c) 临时禁用 Cloudflare 直连源站测试: curl -H "Accept: image/webp" https://pcccc.cc/assets/cache/...
