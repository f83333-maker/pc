# ============================================================
# Nginx WebP 自适应交付 (vhost 兼容版, 不使用 map 指令)
# ============================================================
# 适用环境: 宝塔/aaPanel 的"伪静态"或"配置文件"框
# 注意: 此片段只能放在 server { ... } 内, 禁止放在 http {} 块
#
# 工作原理:
#   - 浏览器发送 Accept: image/webp 时, 自动改读同目录的 .webp
#   - 不支持 WebP 的浏览器, 继续读原 .png/.jpg
#   - URL 完全不变, 数据库/PHP/模板零修改
#   - 文件命名约定: image.png -> image.webp (脚本采用替换扩展名方式)
# ============================================================

# 仅对 /assets/cache 路径下的 png/jpg/jpeg 做 WebP 自适应
# (因为批量转换脚本默认目标就是 assets/cache, 范围更精确, 避免误命中)
location ~* ^/assets/cache/(.+)\.(png|jpe?g)$ {
    # 缓存与 CDN 头 (与已有静态资源缓存一致)
    add_header Vary "Accept" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header CDN-Cache-Control "public, max-age=31536000" always;
    expires 1y;
    access_log off;

    # 用 if 链推断"是否应该改吐 webp"
    set $webp_check "";
    if ($http_accept ~* "image/webp") {
        set $webp_check "A";
    }
    if (-f "$document_root/assets/cache/$1.webp") {
        set $webp_check "${webp_check}B";
    }
    if ($webp_check = "AB") {
        rewrite ^ /assets/cache/$1.webp last;
    }

    try_files $uri =404;
}

# .webp 文件本身的处理 (rewrite 后会走到这里)
location ~* ^/assets/cache/.+\.webp$ {
    add_header Vary "Accept" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header CDN-Cache-Control "public, max-age=31536000" always;
    expires 1y;
    access_log off;
    try_files $uri =404;
}
